name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: docker/setup-docker-action@v5
      - run: npm run e2e
      - run: tar --exclude='*.test.ts' -cz package.json src > postern.tar.gz
      - run: gh release create "$GITHUB_REF_NAME" postern.tar.gz install.sh --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
